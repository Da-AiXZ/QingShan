name: iOS Build (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, iPad)
        run: |
          set -o pipefail
          xcodebuild \
            -project QingShan.xcodeproj \
            -scheme QingShan \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/QingShan.app" Payload/
          zip -qry "QingShan-${{ github.sha }}.ipa" Payload
          ls -lh QingShan-*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: QingShan-ipa
          path: QingShan-*.ipa
          retention-days: 30
